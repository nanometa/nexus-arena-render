[auth]
site_url = "https://nexusarena.pro"
additional_redirect_urls = [
  "https://nexusarena.pro/",
  "https://nexusarena.pro/**",
  "https://www.nexusarena.pro/",
  "https://www.nexusarena.pro/**",
  "https://nexus-arena-4iz.pages.dev/",
  "https://nexus-arena-4iz.pages.dev/**",
  "https://*.nexus-arena-4iz.pages.dev/**",
  "http://localhost:3001/",
  "http://localhost:3001/**",
]

[auth.web3.ethereum]
enabled = true

[auth.rate_limit]
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.nexus-api]
verify_jwt = false
